[package]
name = "bluetuith-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A full-featured Bluetooth manager for the terminal, written in Rust with ratatui"
license = "Apache-2.0"
repository = "https://github.com/Novice-PG/bluetuith-rs"
homepage = "https://github.com/Novice-PG/bluetuith-rs"
authors = ["bluetuith-rs contributors"]
keywords = ["bluetooth", "tui", "ratatui", "bluez", "terminal"]
categories = ["command-line-utilities"]

[[bin]]
name = "bluetuith-rs"
path = "src/main.rs"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"
unicode-width = "0.2"
libc = "0.2"

# BlueZ talks D-Bus. zbus' blocking API keeps the TUI event loop synchronous;
# it is pure Rust, so the binary stays statically linkable for every Linux target.
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
# Used by the pairing Agent to hand an auth request to the UI and wait for it.
async-channel = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
