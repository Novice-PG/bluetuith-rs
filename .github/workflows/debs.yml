name: Build .deb packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all-targets

  musl-debs:
    name: static deb (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-musl
          - arch: arm64
            target: aarch64-unknown-linux-musl
          - arch: armel
            target: arm-unknown-linux-musleabi
          - arch: armhf
            target: armv7-unknown-linux-musleabihf
          - arch: i386
            target: i686-unknown-linux-musl
          - arch: ppc64el
            target: powerpc64le-unknown-linux-musl
          - arch: riscv64
            target: riscv64gc-unknown-linux-musl
          - arch: loong64
            target: loongarch64-unknown-linux-musl
          - arch: ppc64
            target: powerpc64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build .deb
        env:
          OFFLINE: "0"
        run: ./packaging/build-debs.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: packaging/out/*.deb

  gnu-debs:
    # Rust ships only *-linux-gnu std for these architectures, so they need a
    # real cross C toolchain instead of rust-lld.
    name: gnu deb (${{ matrix.arch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: s390x
            target: s390x-unknown-linux-gnu
            cc: s390x-linux-gnu-gcc
            apt: gcc-s390x-linux-gnu
          - arch: sparc64
            target: sparc64-unknown-linux-gnu
            cc: sparc64-linux-gnu-gcc
            apt: gcc-sparc64-linux-gnu
          - arch: powerpc
            target: powerpc-unknown-linux-gnu
            cc: powerpc-linux-gnu-gcc
            apt: gcc-powerpc-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}
      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Cross build
        env:
          TRIPLE: ${{ matrix.target }}
          CC: ${{ matrix.cc }}
        run: |
          ENVNAME="$(printf '%s' "$TRIPLE" | tr '[:lower:]-' '[:upper:]_')"
          export "CARGO_TARGET_${ENVNAME}_LINKER=${CC}"
          cargo build --release --target "$TRIPLE" --bin bluetuith-rs
      - name: Assemble .deb
        env:
          ARCH: ${{ matrix.arch }}
          TRIPLE: ${{ matrix.target }}
        run: |
          # Reuse the packaging script's asset layout through a tiny helper:
          # the script builds the binary itself for musl targets, so for gnu
          # targets we only need to re-point it at the already-built binary.
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess, gzip
          arch = os.environ["ARCH"]; triple = os.environ["TRIPLE"]
          version = "0.1.0"
          out = pathlib.Path("packaging/out"); out.mkdir(parents=True, exist_ok=True)
          pkg = out / f".stage-{arch}"
          if pkg.exists(): shutil.rmtree(pkg)
          for d in ["DEBIAN","usr/bin","usr/share/man/man1","usr/share/doc/bluetuith-rs/examples",
                    "usr/share/applications","usr/share/bash-completion/completions",
                    "usr/share/zsh/vendor-completions"]:
              (pkg/d).mkdir(parents=True, exist_ok=True)
          shutil.copy2(f"target/{triple}/release/bluetuith-rs", pkg/"usr/bin/bluetuith-rs")
          shutil.copy2("debian/bluetuith-rs.1", pkg/"usr/share/man/man1/bluetuith-rs.1")
          data = (pkg/"usr/share/man/man1/bluetuith-rs.1").read_bytes()
          (pkg/"usr/share/man/man1/bluetuith-rs.1.gz").write_bytes(gzip.compress(data, 9))
          (pkg/"usr/share/man/man1/bluetuith-rs.1").unlink()
          shutil.copy2("debian/changelog", pkg/"usr/share/doc/bluetuith-rs/changelog.Debian")
          changelog = (pkg/"usr/share/doc/bluetuith-rs/changelog.Debian").read_bytes()
          (pkg/"usr/share/doc/bluetuith-rs/changelog.Debian.gz").write_bytes(gzip.compress(changelog, 9))
          (pkg/"usr/share/doc/bluetuith-rs/changelog.Debian").unlink()
          for src, dst in [
              ("debian/copyright", "usr/share/doc/bluetuith-rs/copyright"),
              ("README.md", "usr/share/doc/bluetuith-rs/README.md"),
              ("config.example.toml", "usr/share/doc/bluetuith-rs/examples/config.toml"),
              ("debian/bluetuith-rs.desktop", "usr/share/applications/bluetuith-rs.desktop"),
              ("debian/bluetuith-rs.bash-completion", "usr/share/bash-completion/completions/bluetuith-rs"),
              ("debian/bluetuith-rs.zsh-completion", "usr/share/zsh/vendor-completions/_bluetuith-rs"),
          ]:
              shutil.copy2(src, pkg/dst)
          installed = sum(f.stat().st_size for f in (pkg/"usr").rglob("*") if f.is_file()) // 1024
          control = "\n".join([
              "Package: bluetuith-rs",
              f"Version: {version}-1",
              "Section: utils",
              "Priority: optional",
              f"Architecture: {arch}",
              "Maintainer: bluetuith-rs contributors <bluetuith-rs@users.noreply.github.com>",
              "Homepage: https://github.com/Novice-PG/bluetuith-rs",
              f"Installed-Size: {installed}",
              "Depends: libc6",
              "Suggests: bluez, bluez-obexd",
              "Description: full-featured Bluetooth manager for the terminal (ratatui)",
              " A terminal UI for managing Bluetooth adapters and devices over BlueZ D-Bus,",
              " built with ratatui. Statically linked except for glibc on this architecture.",
          ]) + "\n"
          (pkg/"DEBIAN/control").write_text(control)
          subprocess.run(["dpkg-deb", "--build", "--root-owner-group", str(pkg),
                          str(out/f"bluetuith-rs_{version}_{arch}.deb")], check=True)
          shutil.rmtree(pkg)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: packaging/out/*.deb

  release:
    name: Attach .debs to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [musl-debs, gnu-debs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: debs
          merge-multiple: true
      - run: (cd debs && sha256sum ./*.deb > SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            debs/*.deb
            debs/SHA256SUMS
